name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend — lint, build, unit tests
        working-directory: backend
        env:
          # No Postgres in this job — unit tests must not hit the DB (see tests/integration).
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/unused
          NODE_ENV: test
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:unit

      - name: Frontend — build, unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intentdraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend — integration tests (PostgreSQL)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intentdraft_test
          SESSION_SECRET: ci-session-secret-minimum-32-chars-long
          NODE_ENV: test
          RATE_LIMIT_ENABLED: 'true'
        run: |
          npm ci
          npx prisma migrate deploy
          npm run test:integration
